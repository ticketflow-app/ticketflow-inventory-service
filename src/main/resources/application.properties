spring.application.name=ticketflow-inventory-service
server.port=${SERVER_PORT:8082}

# Redis (blocking Lettuce)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# PostgreSQL (JDBC) — source of truth is Redis; PostgreSQL is the audit log
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA: the schema is owned by Flyway, so Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Virtual threads (Java 21) — blocking I/O concurrency without WebFlux/R2DBC
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
resilience4j.retry.instances.inventoryRetry.max-attempts=3
resilience4j.retry.instances.inventoryRetry.wait-duration=500ms
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Service discovery (Eureka)
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Availability reconciliation (DA-001) — interval not defined by the context, chosen for the prototype
inventory.reconciliation.initial-delay-ms=${INVENTORY_RECONCILIATION_INITIAL_DELAY_MS:60000}
inventory.reconciliation.fixed-delay-ms=${INVENTORY_RECONCILIATION_FIXED_DELAY_MS:300000}
