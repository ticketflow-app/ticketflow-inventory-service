spring.application.name=ticketflow-inventory-service
server.port=${SERVER_PORT:8082}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/inventory
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Flyway (JDBC). Flyway does not support R2DBC, so it connects over JDBC.
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/inventory}
spring.flyway.user=${SPRING_FLYWAY_USER:postgres}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:postgres}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}

# Resilience4j Circuit Breaker — Redis adapter
resilience4j.circuitbreaker.instances.redisAdapter.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.redisAdapter.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisAdapter.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.redisAdapter.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisAdapter.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.redisAdapter.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.redisAdapter.waitDurationInOpenState=30s

# Resilience4j Circuit Breaker — Kafka adapter
resilience4j.circuitbreaker.instances.kafkaAdapter.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaAdapter.slidingWindowSize=10
resilience4j.circuitbreaker.instances.kafkaAdapter.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.kafkaAdapter.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaAdapter.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.kafkaAdapter.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.kafkaAdapter.waitDurationInOpenState=30s

# Resilience4j Time Limiter
resilience4j.timelimiter.instances.kafkaAdapter.timeoutDuration=10s
resilience4j.timelimiter.instances.redisAdapter.timeoutDuration=5s
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.retry.backoff.ms=1000
spring.kafka.producer.delivery.timeout.ms=30000
spring.kafka.producer.request.timeout.ms=10000

# Reactive Kafka (ReservationConfirmedEvent topic)
kafka.topic.reservation-confirmed=inventory.reservations.confirmed

# Service discovery (Eureka)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

logging.level.com.inventory.service=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# JWT configuration
jwt.secret=${JWT_SECRET:change-me-in-production-32chars-min}

# Redis client (Lettuce) for Redis 8
spring.data.redis.client-type=lettuce
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Catalog service: source of the localities and capacities used to seed the Redis counters
catalog.base-url=${CATALOG_SERVICE_URL:http://catalog-service:8082}