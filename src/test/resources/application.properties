# Test context: no live infrastructure required for contextLoads.
# JPA properties avoid opening a JDBC connection at startup:
#  - explicit dialect + allow_jdbc_metadata_access=false -> no metadata lookup
#  - ddl-auto=none -> no schema validation
#  - Hikari initialization-fail-timeout=-1 -> pool does not fail-fast without a DB
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=false
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0

eureka.client.enabled=false
